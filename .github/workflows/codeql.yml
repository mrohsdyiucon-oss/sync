name: CodeQL Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [csharp]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'

  report:
    name: Security Report & Notify
    runs-on: ubuntu-latest
    needs: analyze
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate security report
        uses: rsdmike/github-security-report-action@v3.0.0
        with:
          token: ${{ secrets.SECURITY_REPORT_TOKEN }}
          sarifReportDir: '.'
          outputDir: './reports'

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Send report via email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🔒 Security Scan Report — ${{ github.repository }} — Run #${{ github.run_number }}"
          to: mohamed.roshdy@iucon.com.eg
          from: DevSecOps Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            CodeQL security scan completed for ${{ github.repository }}.

            Branch : ${{ github.ref_name }}
            Commit : ${{ github.sha }}
            Run    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Full report is attached. Also available in the GitHub Security tab:
            ${{ github.server_url }}/${{ github.repository }}/security/code-scanning
          attachments: reports/*.pdf